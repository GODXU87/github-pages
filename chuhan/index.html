function renderMap(){let seen={};$("routes").innerHTML=Object.entries(C).flatMap(([id,c])=>c.nb.map(n=>{let k=[id,n].sort().join("-");if(seen[k])return"";seen[k]=1;let d=C[n];return'<line class="route" x1="'+c.x+'" y1="'+c.y+'" x2="'+d.x+'" y2="'+d.y+'"/>'})).join("");$("regions").innerHTML=[["燕",780,83],["趙",655,170],["齊",840,222],["河東",500,185],["關中",365,268],["河南",580,310],["楚",810,420],["漢中",255,390],["巴蜀",150,535],["荊楚",535,555]].map(r=>'<text class="region" x="'+r[1]+'" y="'+r[2]+'">'+r[0]+"</text>").join("");$("citylayer").innerHTML=Object.entries(C).map(([id,c])=>'<g class="city '+(c.f==="han"?"han":c.f==="chu"?"chu":"")+(G.sel===id?" sel":"")+'" data-id="'+id+'" transform="translate('+c.x+","+c.y+')"><circle r="'+(c.cap?15:12)+'"/><circle class="core '+(c.cap?"cap":"")+'" r="4"/><text y="-21">'+c.n+'</text><text class="meta" y="27">'+fl(c.f)+" · "+Math.round(c.t/1000)+"k</text></g>").join("");document.querySelectorAll(".city").forEach(e=>e.onclick=()=>{G.sel=e.dataset.id;G.tab="city";nav();render()});$("armylayer").innerHTML=G.armies.map(a=>{let c=C[a.city],t=a.target?C[a.target]:c,p=a.target?Math.min(.78,.08+a.prog*.35):0,x=c.x+(t.x-c.x)*p,y=c.y+(t.y-c.y)*p,o=off(a.cmd);return'<g class="army" data-a="'+a.id+'" transform="translate('+x+","+y+')"><rect x="-16" y="-10" width="32" height="20" rx="5"/><text y="3">'+(o?o[1].slice(0,2):"軍")+"</text></g>"}).join("")}
function nav(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===G.tab))}
function renderContext(){let p=$("context");if(G.tab==="city"){let c=C[G.sel],own=c.f==="han",os=O.filter(o=>o[3]===G.sel);p.innerHTML='<div class="label">'+c.r+'</div><h2>'+c.n+'</h2><span class="tag">'+fl(c.f)+" · "+(c.cap?"都城":"據點")+'</span><div class="grid4"><div class="stat"><span>人口</span><b>'+fmt(c.p)+'</b></div><div class="stat"><span>駐軍</span><b>'+fmt(c.t)+'</b></div><div class="stat"><span>糧草</span><b>'+fmt(c.food)+'</b></div><div class="stat"><span>金</span><b>'+fmt(c.g)+'</b></div></div><div class="sub">城勢</div><div class="grid4"><div class="stat"><span>農業</span><b>'+c.a+'</b></div><div class="stat"><span>商業</span><b>'+c.c+'</b></div><div class="stat"><span>治安</span><b>'+c.o+'</b></div><div class="stat"><span>城防</span><b>'+c.d+'</b></div></div><div class="divider"></div><div class="sub">駐城人才</div>'+(os.length?os.map(o=>'<div class="officer"><div><b>'+o[1]+'</b><small>'+o[4]+" · "+o[9]+'</small></div><span>統'+o[5]+" 智"+o[7]+"</span></div>").join(""):'<div class="muted">無人物駐留</div>')+'<div class="divider"></div>'+(own?'<div class="sub">本旬指令</div><div class="acts"><button data-act="a"><b>開墾</b><small>農業 +4 / 糧 +4,500</small></button><button data-act="c"><b>商業</b><small>商業 +4 / 金 +1,200</small></button><button data-act="o"><b>治安</b><small>治安 +5</small></button><button data-act="d"><b>築城</b><small>城防 +4 / 金 -600</small></button><button id="recruit"><b>徵兵</b><small>補充 3,000</small></button><button class="danger" id="dispatch"><b>出征</b><small>編成軍團</small></button></div>':'<div class="info">此城屬於 '+fl(c.f)+'。由相鄰己方城池派軍團進攻。</div>');document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>develop(b.dataset.act));if($("recruit"))$("recruit").onclick=recruit;if($("dispatch"))$("dispatch").onclick=dispatch}
else if(G.tab==="officer"){p.innerHTML='<div class="label">OFFICERS</div><h2>漢 · 人才</h2><div class="muted">能力與特性將逐步影響內政、外交與戰爭 AI。</div><div class="divider"></div>'+fo("han").sort((a,b)=>b[5]-a[5]).map(o=>'<div class="officer"><div><b>'+o[1]+" · "+o[4]+'</b><small>'+o[9]+"｜駐 "+C[o[3]].n+'</small></div><span>統'+o[5]+" 武"+o[6]+'<br>智'+o[7]+" 政"+o[8]+"</span></div>").join("")}
else if(G.tab==="army"){p.innerHTML='<div class="label">FIELD ARMIES</div><h2>漢 · 軍團</h2><div class="divider"></div>'+(fa("han").length?fa("han").map(a=>{let o=off(a.cmd),c=C[a.city],t=a.target?C[a.target]:null;return'<div class="stat" style="margin-bottom:8px"><b>'+(o?o[1]:"軍")+'軍</b><div class="muted">兵 '+fmt(a.t)+"｜士氣 "+a.m+"｜軍糧 "+a.s+" 日<br>"+c.n+(t?" → "+t.n:" · 駐紮")+"</div></div>"}).join(""):'<div class="muted">目前無軍團</div>')}
else if(G.tab==="diplo"){let r=F.han.rel;p.innerHTML='<div class="label">DIPLOMACY</div><h2>列國關係</h2><div class="divider"></div>'+Object.entries(r).map(([f,v])=>'<div class="officer"><div><b>'+fl(f)+'</b><small>'+F[f].r+'</small></div><span>'+(v>0?"+":"")+v+" · "+(v<=-70?"敵對":v<0?"警戒":v>=30?"友好":"中立")+"</span></div>").join("")}
else p.innerHTML='<div class="label">CHRONICLE</div><h2>天下紀事</h2><div class="divider"></div>'+G.log.map((x,i)=>'<div class="info" style="margin-bottom:7px">第 '+(G.turn-i)+" 旬　"+x+"</div>").join("")}
function spend(){if(G.ap<1){msg("本旬軍令不足");return false}G.ap--;return true}function msg(x){G.log.unshift(x);$("ticker").textContent=x}
function develop(k){if(!spend())return;let c=C[G.sel];if(k==="a"){c.a=Math.min(100,c.a+4);c.food+=4500;msg(c.n+" 開墾完成。")}if(k==="c"){c.c=Math.min(100,c.c+4);c.g+=1200;msg(c.n+" 商業振興。")}if(k==="o"){c.o=Math.min(100,c.o+5);msg(c.n+" 治安提升。")}if(k==="d"){if(c.g<600){G.ap++;return msg("金不足。")}c.g-=600;c.d=Math.min(100,c.d+4);msg(c.n+" 城防增築。")}render()}
function recruit(){let c=C[G.sel];if(!spend())return;if(c.food<2000||c.p<10000){G.ap++;return msg("人口或糧草不足。")}c.t+=3000;c.p-=4500;c.food-=1800;msg(c.n+" 徵募新兵 3,000。");render()}
function dispatch(){let c=C[G.sel],cmds=fo("han").filter(o=>o[3]===G.sel||o[3]==="nanzheng");modal('<h3>'+c.n+' 出征</h3><div class="field"><label>主將</label><select id="cmd">'+cmds.map(o=>'<option value="'+o[0]+'">'+o[1]+"｜統率 "+o[5]+"</option>").join("")+'</select></div><div class="field"><label>目標</label><select id="target">'+c.nb.map(id=>'<option value="'+id+'">'+C[id].n+"｜"+fl(C[id].f)+"｜守軍 "+fmt(C[id].t)+"</option>").join("")+'</select></div><div class="field"><label>兵力</label><input id="num" type="number" step="1000" min="2000" max="'+c.t+'" value="'+Math.min(8000,c.t)+'"></div><div class="row"><button onclick="closeModal()">取消</button><button class="primary" id="go">下令出征</button></div>');$("go").onclick=()=>{let n=+$("num").value;if(n<2000||n>c.t)return;if(!spend())return;c.t-=n;let a={id:"a"+Date.now(),f:"han",cmd:$("cmd").value,city:G.sel,target:$("target").value,prog:0,t:n,m:82,s:34};G.armies.push(a);msg(off(a.cmd)[1]+"率 "+fmt(n)+" 人自 "+c.n+" 出征。");closeModal();G.tab="army";nav();render()}}
function battle(a){let d=C[a.target],o=off(a.cmd),atk=a.t*(.72+o[5]/200)*(a.m/100),def=d.t*(.85+d.d/160);if(atk>def){let loss=Math.max(600,Math.round(d.t*(.28+Math.random()*.2)));a.t=Math.max(1000,a.t-Math.round(loss*.55));d.t=Math.max(0,d.t-loss);if(d.t<2500){let old=d.f;d.f=a.f;d.t=Math.max(1500,Math.round(a.t*.28));a.t-=d.t;a.city=a.target;a.target=null;a.prog=0;msg(fl(a.f)+"軍攻取 "+d.n+"，"+fl(old)+"失城。")}else{a.target=null;a.prog=0;a.m-=8;msg(a.n+"攻 "+d.n+"，守軍仍據城。")}}else{let loss=Math.round(a.t*(.25+Math.random()*.18));a.t-=loss;a.target=null;a.prog=0;a.m-=14;msg(fl(a.f)+"軍攻 "+d.n+" 失利，折兵 "+fmt(loss)+"。")}if(a.t<800)G.armies=G.armies.filter(x=>x!==a)}
function ai(){Object.keys(F).filter(f=>f!=="han").forEach(f=>{let cs=fc(f);cs.forEach(x=>{let c=x[1];c.food+=Math.round(c.a*38);c.g+=Math.round(c.c*15);if(c.t<10000&&c.food>5000&&Math.random()<.25){c.t+=1500;c.food-=1000}});if(Math.random()<.18&&cs.length){let o=cs.sort((a,b)=>b[1].t-a[1].t)[0],c=o[1],tg=c.nb.map(id=>C[id]).filter(x=>x.f!==f).sort((a,b)=>a.t-b.t)[0],cmd=O.filter(x=>x[2]===f).sort((a,b)=>b[5]-a[5])[0];if(tg&&cmd&&c.t>tg.t*1.6&&c.t>12000){let n=Math.round(c.t*.42);c.t-=n;G.armies.push({id:"ai"+Date.now()+Math.random(),f,cmd:cmd[0],city:o[0],target:Object.keys(C).find(k=>C[k]===tg),prog:0,t:n,m:78,s:28});msg(fl(f)+"軍自 "+c.n+" 出動。")}}})}
function endTurn(){G.turn++;G.ap=3;G.period=(G.period+1)%3;if(G.period===0)G.month++;Object.entries(C).forEach(([id,c])=>{c.food+=Math.round(c.a*50);c.g+=Math.round(c.c*19);c.p+=Math.round(c.p*.001)});G.armies.slice().forEach(a=>{a.s--;if(a.target){a.prog++;if(a.prog>=2)battle(a)}});ai();render()}
function modal(h){$("modal").innerHTML=h;$("modalbg").classList.remove("hide")}function closeModal(){$("modalbg").classList.add("hide")}
function rank(){let r=Object.keys(F).map(f=>({f,p:power(f),c:fc(f).length,t:totals(f).t})).sort((a,b)=>b.p-a.p);modal('<h3>天下勢力</h3><table class="rank"><tr><th>#</th><th>勢力</th><th>君主</th><th>城</th><th>兵力</th><th>勢力值</th></tr>'+r.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+fl(x.f)+'</td><td>'+F[x.f].r+'</td><td>'+x.c+'</td><td>'+fmt(x.t)+'</td><td>'+fmt(x.p)+'</td></tr>').join("")+'</table><div class="row"><button onclick="closeModal()">關閉</button></div>')}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{G.tab=b.dataset.tab;nav();renderContext()});document.querySelectorAll("[data-city]").forEach(b=>b.onclick=()=>{G.sel=b.dataset.city;G.tab="city";nav();render()});$("offBtn").onclick=()=>{G.tab="officer";nav();renderContext()};$("armyBtn").onclick=()=>{G.tab="army";nav();renderContext()};$("rankBtn").onclick=rank;$("helpBtn").onclick=()=>modal('<h3>NOIRXU 楚漢爭霸</h3><div class="info" style="margin-top:14px">這是大型天下戰略的第一個網頁底盤。每旬 3 點軍令，可治理城池、徵兵、編成軍團並沿道路出征。軍團需要兩旬抵達，抵達敵城後進行攻城結算；其他諸侯也會自行發展與出兵。</div><div class="row"><button onclick="closeModal()">開始</button></div>');$("endBtn").onclick=endTurn;$("modalbg").onclick=e=>{if(e.target===$("modalbg"))closeModal()};render();
</script>
</body>
</html>
