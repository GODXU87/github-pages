<head>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font:inherit}
body{display:flex;justify-content:center}
.game{position:relative;width:min(520px,100vw);min-height:100dvh;background:#c8b57f;overflow:hidden;box-shadow:0 0 90px #000}

.topbar{height:74px;position:relative;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px;background:linear-gradient(#21170d,#171009);border-bottom:2px solid #5e4727;color:#f5e6c3}
.side{display:flex;align-items:center;gap:8px}.side.right{justify-content:flex-end}
.seal{width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:#7b251f;color:#ffe0ac;border:1px solid #c47c50;box-shadow:inset 0 0 0 3px #3d1712;font-weight:900}
.side.right .seal{background:#173b32;border-color:#5c8977;box-shadow:inset 0 0 0 3px #0b211d}
.side small{display:block;font:8px ui-sans-serif;color:#9c8b6b;letter-spacing:.1em}.side b{display:block;font-size:12px;margin-top:2px}
.title{text-align:center}.title em{display:block;font:8px ui-sans-serif;letter-spacing:.2em;color:#907c59;font-style:normal}.title strong{font-size:18px;letter-spacing:.12em}
.hpbar{height:6px;width:88px;background:#070604;border-radius:6px;overflow:hidden;border:1px solid #4c3b25;margin-top:5px}.hpbar i{display:block;height:100%;width:100%;transition:.2s}.enemyhp i{background:linear-gradient(90deg,#6c1e1b,#c95645)}.playerhp i{background:linear-gradient(90deg,#205046,#64a28e)}
.stage{position:relative;height:calc(100dvh - 292px);min-height:430px;max-height:640px;overflow:hidden;background:
radial-gradient(circle at 16% 10%,#f0dfa478 0 2%,transparent 15%),
linear-gradient(180deg,#87966d 0%,#87956e 18%,#6f825e 50%,#637454 100%)}
.stage:before{content:"";position:absolute;left:-10%;right:-10%;top:-24px;height:145px;background:
radial-gradient(ellipse at 8% 100%,#536447 0 22%,transparent 23%),
radial-gradient(ellipse at 28% 100%,#455a42 0 28%,transparent 29%),
radial-gradient(ellipse at 52% 100%,#5c684a 0 22%,transparent 23%),
radial-gradient(ellipse at 78% 100%,#40513d 0 26%,transparent 27%),
radial-gradient(ellipse at 94% 100%,#586649 0 24%,transparent 25%);opacity:.75;filter:drop-shadow(0 6px 8px #28322255)}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:18;background:linear-gradient(90deg,rgba(32,22,10,.15),transparent 12%,transparent 88%,rgba(32,22,10,.15)),linear-gradient(180deg,rgba(255,242,197,.08),transparent 30%,rgba(25,19,9,.13))}
.path-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;filter:drop-shadow(0 2px 0 #655a3c55)}
.path-edge{fill:none;stroke:#574b31;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;opacity:.22}
.path-main{fill:none;stroke:#c5ab72;stroke-width:19;stroke-linecap:round;stroke-linejoin:round}
.path-dirt{fill:none;stroke:#a98954;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 11;opacity:.6}
.deco{position:absolute;z-index:2;pointer-events:none}.tree{width:24px;height:32px}.tree:before,.tree:after{content:"";position:absolute;border-radius:50%;background:#39523a;border:1px solid #2b3c2b}.tree:before{width:20px;height:22px;left:2px}.tree:after{width:13px;height:16px;left:9px;top:-6px;background:#496247}.tree i{position:absolute;left:11px;top:19px;width:3px;height:13px;background:#5f4429}.rock{width:20px;height:13px;border-radius:70% 55% 35% 40%;background:#65705b;border:1px solid #4e5748;box-shadow:7px 3px 0 -3px #586151}
.hut{width:31px;height:24px;background:#7b5a34;border:1px solid #513a24;transform:skewY(-2deg)}.hut:before{content:"";position:absolute;left:-5px;top:-10px;border-left:20px solid transparent;border-right:20px solid transparent;border-bottom:15px solid #3f3f2c}.hut:after{content:"";position:absolute;left:12px;bottom:0;width:7px;height:12px;background:#37291c}
.enemy-gate,.home-gate{position:absolute;z-index:5;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;color:#2c2012;font-size:9px;font-weight:900}.enemy-gate{top:7px}.home-gate{bottom:8px}.gate{width:58px;height:25px;background:linear-gradient(#5d482d,#3e2e1c);border:2px solid #2b2117;box-shadow:0 3px 0 #2b2117;display:grid;place-items:center;color:#e1c585}.enemy-gate .gate{background:linear-gradient(#6d3529,#452016);color:#ffd0a6}.home-gate .gate{background:linear-gradient(#315649,#1e3831);color:#d8ecd9}
.wave-chip{position:absolute;z-index:12;top:42px;left:50%;transform:translateX(-50%);background:#20160ed9;color:#ecd9ad;border:1px solid #7b6438;border-radius:12px;padding:5px 9px;font:9px ui-sans-serif;letter-spacing:.08em;box-shadow:0 5px 16px #0005}
.grid-layer,.enemy-layer,.fx-layer{position:absolute;inset:0;z-index:6}.enemy-layer{z-index:8;pointer-events:none}.fx-layer{z-index:15;pointer-events:none}
.slot{position:absolute;width:58px;height:58px;transform:translate(-50%,-50%);border:1px dashed rgba(79,65,38,.38);border-radius:10px;background:rgba(243,226,177,.07);cursor:pointer;transition:.16s}
.slot:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:#6f6a4c44;transform:translate(-50%,-50%)}
.slot.active{border-color:#f5d47e;background:#f3d58333;box-shadow:0 0 0 3px #efd07a16,0 0 22px #ffe08b4f;animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 5px #efd07a0d,0 0 34px #ffe08b66}}
.troop{position:absolute;left:50%;top:50%;width:64px;height:58px;transform:translate(-50%,-50%);pointer-events:none}
.troop .banner{position:absolute;right:-3px;top:-9px;z-index:4;padding:2px 5px;background:#1e2e26;color:#e4d9b3;border:1px solid #8d7543;border-radius:4px;font-size:8px;font-weight:900;box-shadow:0 2px 4px #0005}
.troop.hero .banner{background:#7d291f;color:#ffe29c;border-color:#d4a25a}
.soldier{position:absolute;width:18px;height:23px}
.soldier:before{content:"";position:absolute;left:4px;top:0;width:10px;height:10px;border-radius:50%;background:#c49b69;border:1px solid #4d3928;box-shadow:0 9px 0 3px #30453c}
.soldier:after{content:"";position:absolute;left:8px;top:-6px;width:2px;height:8px;background:#3f2c20}
.s1{left:5px;top:18px;transform:scale(.82)}.s2{left:21px;top:7px;z-index:2}.s3{left:40px;top:19px;transform:scale(.82)}
.troop.archer .soldier:after{width:11px;height:11px;border:1px solid #5b3f23;border-left-color:transparent;border-radius:50%;background:none;left:10px;top:8px}
.troop.cavalry .soldier:before{box-shadow:0 9px 0 3px #573b29,8px 15px 0 2px #795b36}
.troop.guard .soldier:after{width:9px;height:13px;background:#6c774c;border:1px solid #3f492f;left:-2px;top:10px}
.troop.tactician .soldier:before{background:#d4bd93;box-shadow:0 9px 0 3px #5b4a61}
.troop.hit{animation:troophit .15s}.troop.skill{filter:drop-shadow(0 0 8px #ffe18a);animation:skill .32s}
@keyframes troophit{50%{transform:translate(-50%,-50%) scale(.9)}}@keyframes skill{50%{transform:translate(-50%,-50%) scale(1.14)}}
.enemy-unit{position:absolute;width:34px;height:40px;transform:translate(-50%,-50%);transition:none}
.enemy-unit .ehead{position:absolute;left:10px;top:0;width:14px;height:13px;border-radius:50%;background:#bf8f61;border:1px solid #4a2c1c}
.enemy-unit .ebody{position:absolute;left:6px;top:11px;width:22px;height:22px;border-radius:8px 8px 5px 5px;background:#6f2c24;border:1px solid #412018;box-shadow:-9px 5px 0 -4px #7d3329,9px 5px 0 -4px #7d3329}
.enemy-unit.elite .ebody{background:#542c58;border-color:#35203a}.enemy-unit.boss{transform:translate(-50%,-50%) scale(1.25);filter:drop-shadow(0 0 7px #c98e45)}
.enemy-unit .ehp{position:absolute;left:1px;right:1px;top:-6px;height:3px;background:#3e1c17;border-radius:5px;overflow:hidden}.enemy-unit .ehp i{display:block;height:100%;background:#e0664c}
.damage{position:absolute;transform:translate(-50%,-50%);font:900 12px ui-sans-serif;color:#fff2c9;text-shadow:0 2px 4px #000;animation:float .65s ease-out forwards}.damage.crit{font-size:16px;color:#ffcf4e}@keyframes float{to{opacity:0;transform:translate(-50%,-120%)}}
.projectile{position:absolute;width:17px;height:2px;background:#e7d09c;box-shadow:0 0 4px #fff2c7;transform-origin:left center;animation:shoot .18s linear forwards}@keyframes shoot{to{opacity:.1}}
.flash{position:absolute;width:42px;height:42px;border-radius:50%;border:2px solid #f9db79;transform:translate(-50%,-50%) scale(.2);animation:flash .35s ease-out forwards}@keyframes flash{to{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.bottom{position:relative;z-index:20;height:218px;background:linear-gradient(#3a2b19,#21170e 8%,#171009);border-top:3px solid #5a4224;color:#eee1c3;padding:9px 9px calc(8px + env(safe-area-inset-bottom))}
.bottom-top{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 3px}
.resource{display:flex;align-items:center;gap:6px;font:10px ui-sans-serif;color:#aa9876}.coin{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#c79b3d;color:#3d2a12;border:2px solid #e7c66a;font-weight:900}.resource b{font-size:15px;color:#f1d792}.hint{font:9px ui-sans-serif;color:#8c7c60}.hand{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;height:113px}
.card{position:relative;min-width:0;border:2px solid #8a7248;border-radius:7px 7px 9px 9px;background:linear-gradient(160deg,#f1e4c6,#cbb484);box-shadow:inset 0 0 0 2px #5c482b22,0 5px 0 #0d0906,0 8px 12px #0008;color:#2f2418;cursor:pointer;padding:5px 2px 4px;transition:.15s}
.card:before{content:"";position:absolute;inset:4px;border:1px solid #8d764b55;border-radius:4px;pointer-events:none}.card.sel{transform:translateY(-9px);border-color:#f3d26f;box-shadow:0 0 0 2px #f5d77b44,0 7px 0 #0d0906,0 12px 20px #0009}.card.mergeable{animation:cardglow 1s infinite alternate}@keyframes cardglow{to{filter:brightness(1.12);border-color:#e4bd57}}
.card .rank{position:absolute;left:4px;top:3px;font:7px ui-sans-serif;color:#654e2f}.card .char{height:57px;display:grid;place-items:center;font-size:29px;font-weight:900;text-shadow:0 1px #fff8}.card .cname{text-align:center;font-size:8px;font-weight:900;white-space:nowrap;overflow:hidden}.card .stars{text-align:center;font:7px ui-sans-serif;color:#8d5a18;letter-spacing:-1px;margin-top:3px}.card.hero{background:linear-gradient(160deg,#eee0b2,#a77b3e);border-color:#e4bb5c}.card.hero .char{color:#7a261e;font-size:24px}
.card.empty{opacity:.18;cursor:default}.card.empty .char:after{content:"·";font-size:30px}
.actions{height:51px;display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:6px;margin-top:7px}.actions button{border:1px solid #715b36;border-radius:8px;background:#2a2015;color:#e5d4af;box-shadow:inset 0 1px #ffffff12;cursor:pointer;font-weight:900;font-size:10px}.actions button span{display:block;font:7px ui-sans-serif;color:#9d8b68;margin-top:2px}.actions .draw{background:linear-gradient(#7a5b2d,#523b20);border-color:#a78349}.actions .merge{background:linear-gradient(#503a23,#322619)}.actions .speed{background:linear-gradient(#245047,#17382f);border-color:#4f7467}.actions button:disabled{opacity:.35}
.modal{position:absolute;inset:0;z-index:100;background:#0b0805e8;backdrop-filter:blur(9px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}.modal.show{opacity:1;pointer-events:auto}.modal-card{width:100%;background:linear-gradient(#e9d9b1,#c7ad78);border:2px solid #765c34;border-radius:14px;padding:22px;color:#2f2417;box-shadow:0 28px 80px #000}.modal-card .mini-title{font:8px ui-sans-serif;letter-spacing:.22em;color:#7d6540}.modal-card h2{font-size:27px;margin:7px 0}.modal-card p{font:11px/1.7 ui-sans-serif;color:#5d4c34}.factions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.faction{border:1px solid #715b39;border-radius:10px;background:#dec99b;padding:15px;text-align:left;color:#332719;cursor:pointer}.faction strong{font-size:19px}.faction b{float:right;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#6e2b23;color:#f4d2a4}.faction.chu b{background:#254b40;color:#d7e8c8}.faction small{display:block;margin-top:8px;font:8px/1.6 ui-sans-serif;color:#6d5839}.result{text-align:center}.result .stamp{width:65px;height:65px;margin:auto;display:grid;place-items:center;border:3px double #8e3a28;color:#8e3a28;font-size:32px;font-weight:900;transform:rotate(-5deg)}.result button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:#54361e;color:#f5e3bd;font-weight:900}
@media(min-width:700px){body{align-items:center;padding:20px}.game{min-height:860px;height:92vh;max-height:920px;border:1px solid #594426;border-radius:18px}.stage{height:calc(100% - 292px)}}
</style>
</head>
<body>
<div class="game" id="game">
<header class="topbar">
<div class="side"><span class="seal" id="enemySeal">楚</span><div><small>ENEMY</small><b id="enemyName">西楚軍</b><div class="hpbar enemyhp"><i id="enemyHp"></i></div></div></div>
<div class="title"><em>NOIRXU PLAY</em><strong>楚漢爭霸</strong></div>
<div class="side right"><div><small>MY CAMP</small><b id="playerName">漢軍</b><div class="hpbar playerhp"><i id="playerHp"></i></div></div><span class="seal" id="playerSeal">漢</span></div>
</header>

<section class="stage" id="stage">
<svg class="path-svg" viewBox="0 0 100 120" preserveAspectRatio="none" aria-hidden="true">
<path class="path-edge" d="M51 -5 C49 9 61 15 55 27 C48 37 41 42 47 53 C54 64 61 69 54 81 C48 91 43 100 50 125"/>
<path class="path-main" d="M51 -5 C49 9 61 15 55 27 C48 37 41 42 47 53 C54 64 61 69 54 81 C48 91 43 100 50 125"/>
<path class="path-dirt" d="M51 -5 C49 9 61 15 55 27 C48 37 41 42 47 53 C54 64 61 69 54 81 C48 91 43 100 50 125"/>
</svg>
<div class="enemy-gate"><div class="gate" id="enemyGate">楚軍營寨</div></div>
<div class="home-gate"><div class="gate" id="homeGate">漢軍本陣</div></div>
<div class="wave-chip">第 <b id="wave">1</b> 波 · <span id="left">6</span> 敵</div>

<div class="deco tree" style="left:6%;top:12%"><i></i></div><div class="deco tree" style="left:86%;top:8%"><i></i></div>
<div class="deco tree" style="left:5%;top:54%"><i></i></div><div class="deco tree" style="left:89%;top:58%"><i></i></div>
<div class="deco rock" style="left:12%;top:35%"></div><div class="deco rock" style="left:83%;top:41%"></div>
<div class="deco hut" style="left:5%;top:76%"></div><div class="deco hut" style="right:5%;top:25%"></div>

<div class="grid-layer" id="gridLayer"></div>
<div class="enemy-layer" id="enemyLayer"></div>
<div class="fx-layer" id="fx"></div>
</section>

<section class="bottom">
<div class="bottom-top"><div class="resource"><span class="coin">令</span><b id="coin">12</b><span>軍令</span></div><div class="hint" id="hint">先合成，再點戰場空格佈陣</div></div>
<div class="hand" id="hand"></div>
<div class="actions">
<button class="draw" id="draw">補充兵牌<span>3 軍令</span></button>
<button class="merge" id="merge">一鍵合成<span id="mergeText">尋找配對</span></button>
<button class="speed" id="speed">戰速 ×1<span>點擊切換</span></button>
</div>
</section>

<div class="modal show" id="factionModal"><div class="modal-card"><div class="mini-title">CHOOSE YOUR SIDE</div><h2>擇主而戰</h2><p>合成文字兵牌，部署到戰場陣位。敵軍會沿道路南下，守住本陣並擊退所有波次。</p><div class="factions"><button class="faction" data-f="han"><b>漢</b><strong>漢軍</strong><small>劉邦 · 韓信 · 張良 · 樊噲 · 彭越</small></button><button class="faction chu" data-f="chu"><b>楚</b><strong>西楚</strong><small>項羽 · 范增 · 龍且 · 鍾離眛 · 季布</small></button></div></div></div>
<div class="modal" id="resultModal"><div class="modal-card result"><div class="stamp" id="resultStamp">勝</div><h2 id="resultTitle">守住天下</h2><p id="resultText"></p><button id="again">再戰一局</button></div></div>
</div>

<script>
(function(){
"use strict";
var TYPES={
 blade:{ch:"刀",name:"刀兵",atk:17,range:22,rate:720},
 spear:{ch:"槍",name:"槍兵",atk:21,range:25,rate:820},
 bow:{ch:"弓",name:"弓兵",atk:16,range:38,rate:610},
 cavalry:{ch:"騎",name:"騎兵",atk:29,range:24,rate:1050},
 guard:{ch:"盾",name:"盾衛",atk:12,range:20,rate:560},
 tactician:{ch:"策",name:"謀士",atk:24,range:34,rate:1150}
};
var KEYS=Object.keys(TYPES),RANK=["新兵","精兵","銳士","名將"];
var FACTIONS={
 han:{seal:"漢",name:"漢軍",commander:"劉邦",heroes:{blade:"樊噲",spear:"英布",bow:"彭越",cavalry:"韓信",guard:"周勃",tactician:"張良"}},
 chu:{seal:"楚",name:"西楚軍",commander:"項羽",heroes:{blade:"季布",spear:"項莊",bow:"鍾離眛",cavalry:"龍且",guard:"虞子期",tactician:"范增"}}
};
var POS=[[19,17],[82,18],[22,33],[78,34],[18,50],[82,51],[24,67],[77,66],[19,82],[82,82],[34,75],[67,76]];
var PATH=[[51,-5],[50,8],[58,17],[55,27],[47,38],[45,47],[50,57],[57,68],[54,79],[48,91],[47,102],[50,121]];
var $=function(id){return document.getElementById(id)};
var S={f:"han",ef:"chu",hand:new Array(7).fill(null),selected:null,units:new Array(12).fill(null),enemies:[],coin:12,wave:1,left:0,toSpawn:0,spawned:0,base:100,enemyBase:100,run:false,last:0,nextSpawn:0,id:1,speed:1,kills:0};

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function heroName(type,side){return FACTIONS[side==="p"?S.f:S.ef].heroes[type]}
function cardName(c){return c.rank===4?heroName(c.type,"p"):TYPES[c.type].name}
function point(t){
 if(t<=0)return PATH[0];if(t>=1)return PATH[PATH.length-1];
 var z=t*(PATH.length-1),i=Math.floor(z),q=z-i,a=PATH[i],b=PATH[Math.min(i+1,PATH.length-1)];
 return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]
}
function distance(a,b){var dx=a[0]-b[0],dy=a[1]-b[1];return Math.sqrt(dx*dx+dy*dy)}
function setFaction(k){
 S.f=k;S.ef=k==="han"?"chu":"han";
 $("playerSeal").textContent=FACTIONS[S.f].seal;$("playerName").textContent=FACTIONS[S.f].name;
 $("enemySeal").textContent=FACTIONS[S.ef].seal;$("enemyName").textContent=FACTIONS[S.ef].name;
 $("homeGate").textContent=FACTIONS[S.f].commander+"本陣";$("enemyGate").textContent=FACTIONS[S.ef].commander+"營寨";
 $("factionModal").classList.remove("show");start();
}
function start(){
 S.hand=new Array(7).fill(null);S.selected=null;S.units=new Array(12).fill(null);S.enemies=[];S.coin=12;S.wave=1;S.base=100;S.enemyBase=100;S.run=true;S.last=0;S.id=1;S.speed=1;S.kills=0;
 $("enemyLayer").innerHTML="";$("gridLayer").innerHTML="";$("resultModal").classList.remove("show");$("speed").firstChild.nodeValue="戰速 ×1";
 makeSlots();for(var i=0;i<5;i++)drawCard(false);beginWave();renderAll()
}
function makeSlots(){
 POS.forEach(function(p,i){
  var d=document.createElement("button");d.className="slot";d.style.left=p[0]+"%";d.style.top=p[1]+"%";d.dataset.i=i;d.onclick=function(){place(i)};$("gridLayer").appendChild(d)
 })
}
function drawCard(cost){
 var open=[];for(var i=0;i<S.hand.length;i++)if(!S.hand[i])open.push(i);
 if(!open.length){say("兵牌已滿");return false}
 if(cost&&S.coin<3){say("軍令不足");return false}
 if(cost)S.coin-=3;
 S.hand[open[0]]={type:pick(KEYS),rank:1};renderHand();hud();return true
}
function findPair(){
 for(var i=0;i<S.hand.length;i++){var a=S.hand[i];if(!a||a.rank>=4)continue;for(var j=i+1;j<S.hand.length;j++){var b=S.hand[j];if(b&&a.type===b.type&&a.rank===b.rank)return[i,j]}}
 return null
}
function handClick(i){
 var c=S.hand[i];if(!c)return;
 if(S.selected===null){S.selected=i;renderAll();say("選擇戰場空格佈陣，或再點同牌合成");return}
 if(S.selected===i){S.selected=null;renderAll();return}
 var a=S.hand[S.selected];
 if(a&&a.type===c.type&&a.rank===c.rank&&a.rank<4){mergeCards(S.selected,i);S.selected=null;renderAll();return}
 S.selected=i;renderAll()
}
function mergeCards(a,b){
 var c=S.hand[b],nr=c.rank+1;S.hand[b]={type:c.type,rank:nr};S.hand[a]=null;
 S.coin=Math.min(99,S.coin+(nr===4?3:1));
 flashCard(b);say(nr===4?heroName(c.type,"p")+" 來援！":TYPES[c.type].name+" → "+R[nr-1])
}
function autoMerge(){
 var n=0,p;while((p=findPair())&&n<20){mergeCards(p[0],p[1]);n++}
 if(!n)say("目前沒有相同兵牌");S.selected=null;renderAll()
}
function place(i){
 if(S.selected===null){say("先選下方兵牌");return}
 var c=S.hand[S.selected],u=S.units[i];
 if(!c){S.selected=null;renderAll();return}
 if(!u){S.units[i]={type:c.type,rank:c.rank,last:0};S.hand[S.selected]=null;S.selected=null;renderAll();say(cardName(c)+" 佈陣")}
 else if(u.type===c.type&&u.rank===c.rank&&u.rank<4){u.rank++;S.hand[S.selected]=null;S.selected=null;renderAll();skillFx(i);say(u.rank===4?heroName(u.type,"p")+" 登場！":"場上合成 → "+R[u.rank-1])}
 else say("此陣位已有其他部隊")
}
function renderHand(){
 var h=$("hand");h.innerHTML="";
 S.hand.forEach(function(c,i){
  var b=document.createElement("button");b.className="card"+(c?"":" empty")+(S.selected===i?" sel":"");
  if(c&&findMate(i))b.classList.add("mergeable");
  if(c&&c.rank===4)b.classList.add("hero");
  if(c)b.innerHTML='<span class="rank">'+R[c.rank-1]+'</span><div class="char">'+(c.rank===4?heroName(c.type,"p").substring(0,1):TYPES[c.type].ch)+'</div><div class="cname">'+cardName(c)+'</div><div class="stars">'+"★".repeat(c.rank)+'</div>';
  else b.innerHTML='<div class="char"></div>';
  b.onclick=function(){handClick(i)};h.appendChild(b)
 })
}
function findMate(i){var a=S.hand[i];if(!a||a.rank>=4)return false;for(var j=0;j<S.hand.length;j++){if(j===i)continue;var b=S.hand[j];if(b&&b.type===a.type&&b.rank===a.rank)return true}return false}
function flashCard(i){setTimeout(function(){var c=$("hand").children[i];if(c){c.classList.remove("sel");void c.offsetWidth;c.classList.add("sel");setTimeout(function(){c.classList.remove("sel")},240)}},0)}
function troopHTML(u){
 var name=u.rank===4?heroName(u.type,"p"):TYPES[u.type].ch;
 return '<div class="troop '+u.type+(u.rank===4?' hero':'')+'"><span class="banner">'+name+'</span><i class="soldier s1"></i><i class="soldier s2"></i><i class="soldier s3"></i></div>'
}
function renderUnits(){
 var slots=$("gridLayer").children;
 S.units.forEach(function(u,i){
  var slot=slots[i];slot.classList.toggle("active",S.selected!==null&&!u);
  var old=slot.querySelector(".troop");if(old)old.remove();
  if(u)slot.insertAdjacentHTML("beforeend",troopHTML(u))
 })
}
function beginWave(){
 S.toSpawn=5+S.wave*2;S.spawned=0;S.left=S.toSpawn+S.enemies.length;S.nextSpawn=300;
 say("第 "+S.wave+" 波 · "+FACTIONS[S.ef].name+"來襲")
}
function spawnEnemy(){
 var elite=S.wave>=3&&Math.random()<Math.min(.32,S.wave*.035),boss=S.wave%5===0&&S.spawned===S.toSpawn-1;
 var hp=(56+S.wave*11)*(elite?1.55:1)*(boss?2.25:1),speed=(.017+S.wave*.00045)*(elite?1.08:1)*(boss?.8:1);
 var e={id:S.id++,t:0,hp:hp,max:hp,speed:speed,elite:elite,boss:boss,dead:false};S.enemies.push(e);
 var d=document.createElement("div");d.id="e"+e.id;d.className="enemy-unit"+(elite?" elite":"")+(boss?" boss":"");d.innerHTML='<div class="ehp"><i></i></div><i class="ehead"></i><i class="ebody"></i>';$("enemyLayer").appendChild(d);updateEnemyEl(e)
}
function updateEnemyEl(e){
 var p=point(e.t),d=$("e"+e.id);if(!d)return;d.style.left=p[0]+"%";d.style.top=p[1]+"%";d.querySelector(".ehp i").style.width=Math.max(0,e.hp/e.max*100)+"%"
}
function enemyTick(dt){
 S.nextSpawn-=dt;if(S.spawned<S.toSpawn&&S.nextSpawn<=0){spawnEnemy();S.spawned++;S.nextSpawn=Math.max(360,1050-S.wave*45)}
 S.enemies.forEach(function(e){
  if(e.dead)return;e.t+=e.speed*dt/1000;
  if(e.t>=1){e.dead=true;S.base-=e.boss?18:e.elite?10:6;var d=$("e"+e.id);if(d)d.remove();say("敵軍突破！ 本陣受損")}
  else updateEnemyEl(e)
 });
 cleanupEnemies();
 if(S.spawned>=S.toSpawn&&S.enemies.length===0&&S.run){S.wave++;S.coin=Math.min(99,S.coin+4);for(var z=0;z<2;z++)drawCard(false);setTimeout(beginWave,850)}
}
function unitTick(now){
 S.units.forEach(function(u,i){
  if(!u)return;var base=TYPES[u.type],mul=1+(u.rank-1)*.64,range=base.range+(u.rank===4?6:0),target=null,best=999;
  S.enemies.forEach(function(e){if(e.dead)return;var p=point(e.t),d=distance(POS[i],p);if(d<range&&d<best){best=d;target=e}});
  var rate=base.rate*(u.rank===4?.82:1);if(target&&now-u.last>=rate/S.speed){
   u.last=now;var crit=Math.random()<(u.rank===4?.15:.04),dmg=base.atk*mul*(crit?1.75:1);
   if(u.type==="spear"&&target.elite)dmg*=1.25;if(u.type==="cavalry"&&target.t>.62)dmg*=1.2;if(u.type==="guard")dmg*=.82;
   target.hp-=dmg;projectile(i,target,u.type);damageFx(target,dmg,crit);troopHit(i,u.rank===4&&Math.random()<.22);
   if(u.rank===4&&Math.random()<.16)heroSkill(i,u,target,dmg);
   if(target.hp<=0&&!target.dead){target.dead=true;S.kills++;S.coin=Math.min(99,S.coin+(target.boss?4:target.elite?2:1));var de=$("e"+target.id);if(de){de.style.opacity=0;de.style.transform+=" scale(.3)";setTimeout(function(){de.remove()},180)}}
  }
 })
}
function heroSkill(i,u,target,dmg){
 skillFx(i);var n=heroName(u.type,"p");
 if(u.type==="bow"||u.type==="tactician"){S.enemies.forEach(function(e){if(!e.dead&&e.id!==target.id&&Math.abs(e.t-target.t)<.09)e.hp-=dmg*.55});say(n+" · 萬箭／奇策")}
 else if(u.type==="blade"||u.type==="spear"){target.hp-=dmg*.75;say(n+" · 破陣")}
 else if(u.type==="cavalry"){target.hp-=dmg;say(n+" · 突騎")}
 else{S.base=Math.min(100,S.base+1.5);say(n+" · 固守")}
}
function projectile(i,e,type){
 var a=POS[i],b=point(e.t),fx=$("fx"),p=document.createElement("i");p.className="projectile";p.style.left=a[0]+"%";p.style.top=a[1]+"%";
 var dx=b[0]-a[0],dy=b[1]-a[1],angle=Math.atan2(dy,dx)*180/Math.PI,len=Math.sqrt(dx*dx+dy*dy);p.style.width=len*.52+"%";p.style.transform="rotate("+angle+"deg)";fx.appendChild(p);setTimeout(function(){p.remove()},190)
}
function damageFx(e,dmg,crit){
 var p=point(e.t),x=document.createElement("span");x.className="damage"+(crit?" crit":"");x.style.left=p[0]+"%";x.style.top=p[1]+"%";x.textContent=(crit?"✦ ":"")+Math.round(dmg);$("fx").appendChild(x);setTimeout(function(){x.remove()},680)
}
function troopHit(i,skill){var slot=$("gridLayer").children[i],t=slot.querySelector(".troop");if(!t)return;t.classList.remove("hit","skill");void t.offsetWidth;t.classList.add(skill?"skill":"hit")}
function skillFx(i){var p=POS[i],x=document.createElement("i");x.className="flash";x.style.left=p[0]+"%";x.style.top=p[1]+"%";$("fx").appendChild(x);setTimeout(function(){x.remove()},380)}
function cleanupEnemies(){S.enemies=S.enemies.filter(function(e){return !e.dead})}
function hud(){
 $("coin").textContent=Math.floor(S.coin);$("wave").textContent=S.wave;$("left").textContent=Math.max(0,(S.toSpawn-S.spawned)+S.enemies.length);
 $("playerHp").style.width=Math.max(0,S.base)+"%";$("enemyHp").style.width=Math.max(0,S.enemyBase)+"%";
 $("draw").disabled=S.coin<3||S.hand.every(Boolean);var p=findPair();$("merge").disabled=!p;$("mergeText").textContent=p?"可立即合成":"無可配對"
}
function renderAll(){renderHand();renderUnits();hud()}
function say(x){$("hint").textContent=x}
function finish(win){
 S.run=false;$("resultStamp").textContent=win?"勝":"敗";$("resultTitle").textContent=win?"楚漢定局":"本陣失守";
 $("resultText").textContent=win?"你守住所有攻勢。":"守到第 "+S.wave+" 波，殲敵 "+S.kills+"。";$("resultModal").classList.add("show")
}
function loop(ts){
 if(!S.last)S.last=ts;var raw=Math.min(50,ts-S.last);S.last=ts;
 if(S.run){var dt=raw*S.speed;enemyTick(dt);unitTick(ts*S.speed);cleanupEnemies();hud();if(S.base<=0)finish(false);if(S.wave>12&&S.enemies.length===0&&S.spawned>=S.toSpawn)finish(true)}
 requestAnimationFrame(loop)
}
document.querySelectorAll(".faction").forEach(function(b){b.onclick=function(){setFaction(b.dataset.f)}});
$("draw").onclick=function(){drawCard(true)};$("merge").onclick=autoMerge;
$("speed").onclick=function(){S.speed=S.speed===1?1.5:S.speed===1.5?2:1;$("speed").firstChild.nodeValue="戰速 ×"+S.speed};
$("again").onclick=function(){$("resultModal").classList.remove("show");$("factionModal").classList.add("show");S.run=false};
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
